services:
  postgres:
    image: postgres:16-alpine
    container_name: inkspace-postgres
    environment:
      POSTGRES_USER: inkspace
      POSTGRES_PASSWORD: inkspace
      POSTGRES_DB: inkspace
    ports:
      - "5432:5432"
    volumes:
      - inkspace-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkspace -d inkspace"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: inkspace-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: inkspace-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DATABASE_URL: postgres://inkspace:inkspace@postgres:5432/inkspace?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"

volumes:
  inkspace-pg-data:
